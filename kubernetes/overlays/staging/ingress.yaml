apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: options-tracker-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: options-staging.rath.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: options-tracker
                port:
                  number: 8000
  tls:
    - hosts:
        - options-staging.rath.home


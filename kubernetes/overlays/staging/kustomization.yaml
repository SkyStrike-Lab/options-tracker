apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab-staging
resources:
  - ../../base
  - ingress.yaml
images:
  - name: registry.home/options-tracker:placeholder
    newName: options-tracker-options-tracker
    newTag: latest
patches:

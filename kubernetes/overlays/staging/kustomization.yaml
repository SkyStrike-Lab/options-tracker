apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab-staging
resources:
  - ../../base
  - ingress.yaml
images:
  - name: registry.home/options-tracker:placeholder
    newName: registry.home/options-tracker
    newTag: latest
patches:
  - path: patch-storage.yaml
    target:
      kind: Deployment
      name: options-tracker
  - target:
      kind: ConfigMap
      name: options-tracker-config
    patch: |-
      - op: replace
        path: /data/IB_DATA_FILE
        value: "/app/data/ib_data.json"
  - target:
      kind: Deployment
      name: options-tracker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
